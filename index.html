<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Uma pausa de verdade: uma partida contra a máquina, sem cadastro e sem relógio correndo."
    />
    <meta name="theme-color" content="#E8EBE3" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Break And Relax</title>

    <!--
      Preview do link compartilhado. Duas exigencias de quem lê estas tags, e as
      duas contrariam o resto do arquivo, que usa caminho relativo por causa do
      base /break-and-relax/:

      1. A URL da imagem precisa ser absoluta. O WhatsApp, o Facebook e afins
         buscam a imagem de fora, sem a pagina por perto para resolver caminho
         relativo, entao um ./og.png simplesmente nao seria buscado.
      2. A imagem precisa ser PNG. O favicon deste site e SVG, que o WhatsApp
         nao rasteriza em preview. Por isso existe o og.png, gerado do mesmo
         cavalo por npm run og.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Break And Relax" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Break And Relax" />
    <meta
      property="og:description"
      content="Uma pausa de verdade: uma partida contra a máquina, sem cadastro e sem relógio correndo."
    />
    <meta property="og:url" content="https://luccas-souza7.github.io/break-and-relax/" />
    <meta property="og:image" content="https://luccas-souza7.github.io/break-and-relax/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Um cavalo de xadrez ao lado do nome Break And Relax."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- dev-entry-notice:start -->
    <!--
      This file is the development entry: it loads TypeScript source through
      the dev server. Opened straight off the disk it can only ever be blank,
      and a blank page explains nothing, so say what to run instead.

      Guarded twice: only on file://, and only if nothing ever mounted. It is
      stripped from the build, and never appears on an http(s) deploy.
    -->
    <script>
      window.addEventListener('load', function () {
        if (location.protocol !== 'file:') return
        var root = document.getElementById('root')
        if (!root || root.childElementCount > 0) return
        root.setAttribute(
          'style',
          'font:400 15px/1.6 ui-sans-serif,system-ui,sans-serif;color:#1B211C;' +
            'max-width:34rem;margin:20vh auto;padding:0 1.5rem;text-align:center',
        )
        root.innerHTML =
          '<p style="letter-spacing:.2em;font-size:13px">BREAK AND RELAX</p>' +
          '<p style="margin-top:2rem">Este arquivo é o ponto de entrada de desenvolvimento e ' +
          'precisa do servidor do Vite.</p>' +
          '<p style="color:#656B62">Para desenvolver, rode <code>npm run dev</code>. ' +
          'Para conferir a build, rode <code>npm run preview</code>.</p>'
      })
    </script>
    <!-- dev-entry-notice:end -->
  </body>
</html>
